<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="160" height="192">
  <defs>
    <linearGradient id="androidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84" />
      <stop offset="100%" stop-color="#24B364" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Antennas -->
  <line x1="70" y1="48" x2="56" y2="26" stroke="#3DDC84" stroke-width="5" stroke-linecap="round" />
  <line x1="130" y1="48" x2="144" y2="26" stroke="#3DDC84" stroke-width="5" stroke-linecap="round" />

  <!-- Head -->
  <path d="M 50,92 A 50,50 0 0,1 150,92 Z" fill="url(#androidGrad)" />

  <!-- AI Neural Visor / Eyes -->
  <circle cx="75" cy="66" r="5" fill="#0D1117" />
  <circle cx="75" cy="66" r="2.5" fill="#00D8D6" filter="url(#aiGlow)" />
  <circle cx="125" cy="66" r="5" fill="#0D1117" />
  <circle cx="125" cy="66" r="2.5" fill="#00D8D6" filter="url(#aiGlow)" />

  <!-- Left Arm -->
  <rect x="28" y="98" width="15" height="65" rx="7.5" fill="url(#androidGrad)" />

  <!-- Right Arm -->
  <rect x="157" y="98" width="15" height="65" rx="7.5" fill="url(#androidGrad)" />

  <!-- Body -->
  <path d="M 50,98 L 150,98 L 150,165 A 16,16 0 0,1 134,181 L 66,181 A 16,16 0 0,1 50,165 Z" fill="url(#androidGrad)" />

  <!-- AI Pulse Core on Chest -->
  <circle cx="100" cy="130" r="12" fill="#0D1117" opacity="0.3" />
  <circle cx="100" cy="130" r="5" fill="#00D8D6" filter="url(#aiGlow)" />
  <line x1="88" y1="130" x2="95" y2="130" stroke="#00D8D6" stroke-width="2" stroke-linecap="round" />
  <line x1="105" y1="130" x2="112" y2="130" stroke="#00D8D6" stroke-width="2" stroke-linecap="round" />

  <!-- Left Leg -->
  <rect x="68" y="188" width="15" height="42" rx="7.5" fill="url(#androidGrad)" />

  <!-- Right Leg -->
  <rect x="117" y="188" width="15" height="42" rx="7.5" fill="url(#androidGrad)" />
</svg>
